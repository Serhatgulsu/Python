<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Loop Pipes</title>
<style>
  :root{--bg:#0b0f1a;--card:#161f38;--txt:#e8eefc;--muted:#8a98bd;--acc:#5b8cff;--good:#3ddc97}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(900px 600px at 50% -10%,#16213e,var(--bg) 60%);color:var(--txt);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
  a.back{position:fixed;top:12px;left:14px;color:var(--muted);text-decoration:none;font-size:14px;z-index:9}
  h1{font-size:22px;margin:6px 0 2px;font-weight:800}
  .sub{color:var(--muted);font-size:13px;margin-bottom:10px;text-align:center;max-width:340px}
  .hud{display:flex;gap:12px;margin-bottom:10px}
  .stat{background:var(--card);border:1px solid #ffffff14;border-radius:12px;padding:7px 13px;font-weight:700;font-size:14px}
  .stat small{color:var(--muted);font-weight:600;font-size:11px;display:block}
  canvas{background:#0f1730;border-radius:18px;border:1px solid #ffffff10;touch-action:manipulation}
  .msg{margin-top:12px;font-weight:700;height:22px}
  .btn{margin-top:8px;background:#ffffff12;color:var(--txt);border:none;padding:10px 18px;border-radius:12px;font-weight:700}
</style></head><body>
<a class="back" href="index.html">← Geri</a>
<h1>🔵 Loop Pipes</h1>
<div class="sub">Karolara dokunup döndür. Tüm boruları birbirine bağlayıp tek kapalı su döngüsü oluştur (açık uç kalmasın).</div>
<div class="hud">
  <div class="stat"><small>Level</small><span id="lvl">1</span></div>
  <div class="stat"><small>Açık uç</small><span id="open">0</span></div>
</div>
<canvas id="cv" width="320" height="320"></canvas>
<div class="msg" id="msg"></div>
<button class="btn" onclick="build()">↺ Yeni</button>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let N=4,CELL,grid,level=1;
// each cell: array of open directions [up,right,down,left] booleans
function rot(d){return [d[3],d[0],d[1],d[2]];} // rotate cw
function build(){
  N=Math.min(3+Math.floor(level/2),6);CELL=320/N;
  // generate a solved loop via random spanning structure: simple snake loop guarantee = full border + internal?
  // Use: build a random closed loop on grid using "all cells part of a single cycle" is hard;
  // simpler solvable: create random pipes then we just require every open end matches neighbor.
  grid=Array.from({length:N},()=>Array.from({length:N},()=>[false,false,false,false]));
  // build a Hamiltonian-ish loop: go around perimeter (always solvable closed loop)
  // mark perimeter path connections
  const path=[];
  for(let c=0;c<N;c++)path.push([0,c]);
  for(let r=1;r<N;r++)path.push([r,N-1]);
  for(let c=N-2;c>=0;c--)path.push([N-1,c]);
  for(let r=N-2;r>=1;r--)path.push([r,0]);
  for(let i=0;i<path.length;i++){
    const [r,c]=path[i],[nr,nc]=path[(i+1)%path.length];
    connect(r,c,nr,nc);
  }
  // scramble rotations
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=Math.random()*4|0;for(let t=0;t<k;t++)grid[r][c]=rot(grid[r][c]);}
  document.getElementById('lvl').textContent=level;document.getElementById('msg').textContent='';
  draw();
}
function connect(r,c,nr,nc){
  if(nr===r&&nc===c+1){grid[r][c][1]=true;grid[nr][nc][3]=true;}
  if(nr===r&&nc===c-1){grid[r][c][3]=true;grid[nr][nc][1]=true;}
  if(nr===r+1&&nc===c){grid[r][c][2]=true;grid[nr][nc][0]=true;}
  if(nr===r-1&&nc===c){grid[r][c][0]=true;grid[nr][nc][2]=true;}
}
function openEnds(){
  let cnt=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=grid[r][c];
    const nb=[[r-1,c,0,2],[r,c+1,1,3],[r+1,c,2,0],[r,c-1,3,1]];
    nb.forEach(([nr,nc,dir,opp])=>{if(d[dir]){
      if(nr<0||nr>=N||nc<0||nc>=N||!grid[nr][nc][opp])cnt++;}});
  }
  return cnt;
}
function draw(){
  ctx.clearRect(0,0,320,320);
  const open=openEnds();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const cx=c*CELL+CELL/2,cy=r*CELL+CELL/2,d=grid[r][c];
    ctx.strokeStyle=open===0?'#3ddc97':'#5b8cff';ctx.lineWidth=Math.max(6,CELL*0.16);ctx.lineCap='round';
    ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=open===0?12:0;
    const ends=[[cx,cy-CELL/2],[cx+CELL/2,cy],[cx,cy+CELL/2],[cx-CELL/2,cy]];
    d.forEach((on,i)=>{if(on){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ends[i][0],ends[i][1]);ctx.stroke();}});
    ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(cx,cy,ctx.lineWidth*0.5,0,6.3);ctx.fillStyle=ctx.strokeStyle;ctx.fill();
  }
  ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;
  for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,320);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(320,i*CELL);ctx.stroke();}
  document.getElementById('open').textContent=open;
  if(open===0){document.getElementById('msg').textContent='✅ Döngü kapandı!';document.getElementById('msg').style.color='var(--good)';
    if(!window._w){window._w=1;setTimeout(()=>{level++;window._w=0;build();},1100);}}
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();
  const c=(e.clientX-r.left)/CELL|0,row=(e.clientY-r.top)/CELL|0;
  if(grid[row]&&grid[row][c]){grid[row][c]=rot(grid[row][c]);draw();}});
build();
</script>
</body></html>
