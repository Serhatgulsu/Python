<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Tile Shift</title>
<style>
  :root{--bg:#0b0f1a;--card:#161f38;--txt:#e8eefc;--muted:#8a98bd;--acc:#5b8cff;--good:#3ddc97}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(900px 600px at 50% -10%,#16213e,var(--bg) 60%);color:var(--txt);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
  a.back{position:fixed;top:12px;left:14px;color:var(--muted);text-decoration:none;font-size:14px;z-index:9}
  h1{font-size:22px;margin:6px 0 2px;font-weight:800}
  .sub{color:var(--muted);font-size:13px;margin-bottom:10px;text-align:center;max-width:350px}
  .hud{display:flex;gap:12px;margin-bottom:10px}
  .stat{background:var(--card);border:1px solid #ffffff14;border-radius:12px;padding:7px 13px;font-weight:700;font-size:14px}
  .stat small{color:var(--muted);font-weight:600;font-size:11px;display:block}
  .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
  .mini{display:grid;gap:3px;padding:6px;background:#0f1730;border-radius:10px}
  .mini .c{width:20px;height:20px;border-radius:5px}
  .minilbl{text-align:center;color:var(--muted);font-size:11px;margin-top:5px;font-weight:600}
  #board{display:grid;gap:5px;background:#0f1730;padding:9px;border-radius:16px;border:1px solid #ffffff10}
  .c{width:46px;height:46px;border-radius:10px;cursor:pointer;transition:all .15s}
  .arrowbtn{position:relative}
  .msg{margin-top:12px;font-weight:700;height:22px}
  .hint{color:var(--muted);font-size:12px;margin-top:6px}
</style></head><body>
<a class="back" href="index.html">← Geri</a>
<h1>🟦 Tile Shift</h1>
<div class="sub">Bir satırın yanına / sütunun üstüne dokun → o sıra kayar (döner). Deseni HEDEF ile aynı yap.</div>
<div class="hud">
  <div class="stat"><small>Level</small><span id="lvl">1</span></div>
  <div class="stat"><small>Hamle</small><span id="mv">0</span></div>
</div>
<div class="wrap">
  <div><div class="mini" id="target"></div><div class="minilbl">HEDEF</div></div>
  <div><div id="board"></div></div>
</div>
<div class="hint">Üst/alt = sütun kaydır • sağ/sol = satır kaydır</div>
<div class="msg" id="msg"></div>
<script>
const COLORS=['#5b8cff','#3ddc97','#ffcc5c','#ff6b6b','#c77dff'];
let N=3,goal=[],grid=[],level=1,moves=0;
const boardEl=document.getElementById('board');
function build(){
  N=Math.min(3+Math.floor(level/3),5);
  const nc=Math.min(2+Math.floor(level/2),5);
  goal=Array.from({length:N},()=>Array.from({length:N},()=>Math.random()*nc|0));
  grid=goal.map(r=>[...r]);
  // scramble with valid moves
  const sc=4+level*2;
  for(let k=0;k<sc;k++){const r=Math.random()*N|0;Math.random()<0.5?shiftRow(r,1,true):shiftCol(r,1,true);}
  moves=0;document.getElementById('lvl').textContent=level;document.getElementById('msg').textContent='';
  renderTarget();render();
}
function shiftRow(r,dir,silent){if(dir>0)grid[r].unshift(grid[r].pop());else grid[r].push(grid[r].shift());
  if(!silent){moves++;render();}}
function shiftCol(c,dir,silent){let col=grid.map(row=>row[c]);
  if(dir>0)col.unshift(col.pop());else col.push(col.shift());
  grid.forEach((row,i)=>row[c]=col[i]);if(!silent){moves++;render();}}
function renderTarget(){const t=document.getElementById('target');t.style.gridTemplateColumns=`repeat(${N},20px)`;t.innerHTML='';
  goal.forEach(row=>row.forEach(v=>{const d=document.createElement('div');d.className='c';d.style.background=COLORS[v];t.appendChild(d);}));}
function render(){
  boardEl.style.gridTemplateColumns=`repeat(${N},46px)`;boardEl.innerHTML='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement('div');d.className='c';d.style.background=COLORS[grid[r][c]];
    // click left half of leftmost col = shift row; handled simply: tap row->shift right, with edge logic
    d.onclick=()=>{
      // decide: if it's an edge cell, shift that line; choose by position
      if(c===0)shiftRow(r,-1);else if(c===N-1)shiftRow(r,1);
      else if(r===0)shiftCol(c,-1);else if(r===N-1)shiftCol(c,1);
      else shiftRow(r,1);
    };
    boardEl.appendChild(d);
  }
  document.getElementById('mv').textContent=moves;
  if(grid.every((row,r)=>row.every((v,c)=>v===goal[r][c]))){
    document.getElementById('msg').textContent='✅ Desen eşleşti!';document.getElementById('msg').style.color='var(--good)';
    if(!window._w){window._w=1;setTimeout(()=>{level++;window._w=0;build();},1100);}}
}
build();
</script>
</body></html>
