<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Laser Bend</title>
<style>
  :root{--bg:#0b0f1a;--card:#161f38;--txt:#e8eefc;--muted:#8a98bd;--acc:#5b8cff;--good:#3ddc97}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(900px 600px at 50% -10%,#16213e,var(--bg) 60%);color:var(--txt);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
  a.back{position:fixed;top:12px;left:14px;color:var(--muted);text-decoration:none;font-size:14px;z-index:9}
  h1{font-size:22px;margin:6px 0 2px;font-weight:800}
  .sub{color:var(--muted);font-size:13px;margin-bottom:10px;text-align:center;max-width:340px}
  .hud{display:flex;gap:12px;margin-bottom:10px}
  .stat{background:var(--card);border:1px solid #ffffff14;border-radius:12px;padding:7px 13px;font-weight:700;font-size:14px}
  .stat small{color:var(--muted);font-weight:600;font-size:11px;display:block}
  canvas{background:#0f1730;border-radius:18px;border:1px solid #ffffff10;touch-action:manipulation}
  .msg{margin-top:12px;font-weight:700;height:22px}
  .btn{margin-top:8px;background:#ffffff12;color:var(--txt);border:none;padding:10px 18px;border-radius:12px;font-weight:700}
</style></head><body>
<a class="back" href="index.html">← Geri</a>
<h1>🔦 Laser Bend</h1>
<div class="sub">Aynalara dokunup döndür (/ ↔ \). Lazeri kaynaktan 🎯 hedefe ulaştır.</div>
<div class="hud">
  <div class="stat"><small>Level</small><span id="lvl">1</span></div>
  <div class="stat"><small>Durum</small><span id="st">—</span></div>
</div>
<canvas id="cv" width="320" height="320"></canvas>
<div class="msg" id="msg"></div>
<button class="btn" onclick="build()">↺ Yeni</button>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const N=6,CELL=320/N;let grid,src,dst,level=1;
function build(){
  grid=Array.from({length:N},()=>Array(N).fill(null));
  src={r:Math.random()*N|0,c:0,dir:[0,1]};
  dst={r:Math.random()*N|0,c:N-1};
  // place some mirrors randomly the player rotates
  const m=Math.min(2+level,6);
  for(let k=0;k<m;k++){let r,c,t=0;do{r=Math.random()*N|0;c=1+(Math.random()*(N-2)|0);t++}while((grid[r][c]||(r===src.r&&c===src.c))&&t<40);
    grid[r][c]=Math.random()<0.5?'/':'\\';}
  document.getElementById('lvl').textContent=level;document.getElementById('msg').textContent='';
  draw();
}
function trace(){
  let r=src.r,c=src.c,[dr,dc]=src.dir;const path=[[r+0.5,c+0.5]];let steps=0;
  while(steps++<100){
    r+=dr;c+=dc;
    if(r<0||r>=N||c<0||c>=N){path.push([r+0.5,c+0.5]);return {path,hit:false};}
    path.push([r+0.5,c+0.5]);
    if(r===dst.r&&c===dst.c)return {path,hit:true};
    const m=grid[r][c];
    if(m==='/'){[dr,dc]=[-dc,-dr];}
    else if(m==='\\'){[dr,dc]=[dc,dr];}
  }
  return {path,hit:false};
}
function draw(){
  ctx.clearRect(0,0,320,320);
  // grid
  ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;
  for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,320);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(320,i*CELL);ctx.stroke();}
  const {path,hit}=trace();
  // beam
  ctx.beginPath();ctx.moveTo(path[0][1]*CELL,path[0][0]*CELL);
  for(let i=1;i<path.length;i++)ctx.lineTo(path[i][1]*CELL,path[i][0]*CELL);
  ctx.strokeStyle=hit?'#3ddc97':'#ff6b6b';ctx.lineWidth=4;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;
  // mirrors
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!grid[r][c])continue;
    ctx.strokeStyle='#e8eefc';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();
    const x=c*CELL,y=r*CELL,p=12;
    if(grid[r][c]==='/'){ctx.moveTo(x+CELL-p,y+p);ctx.lineTo(x+p,y+CELL-p);}
    else{ctx.moveTo(x+p,y+p);ctx.lineTo(x+CELL-p,y+CELL-p);}
    ctx.stroke();}
  // source & dest
  ctx.fillStyle='#5b8cff';ctx.beginPath();ctx.arc((src.c+0.5)*CELL,(src.r+0.5)*CELL,10,0,6.3);ctx.fill();
  ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🎯',(dst.c+0.5)*CELL,(dst.r+0.5)*CELL);
  document.getElementById('st').textContent=hit?'✅ Vurdu':'… ışınla';
  if(hit){document.getElementById('msg').textContent='✅ Hedef vuruldu!';document.getElementById('msg').style.color='var(--good)';
    if(!window._w){window._w=1;setTimeout(()=>{level++;window._w=0;build();},1100);}}
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();
  const c=(e.clientX-r.left)/CELL|0,row=(e.clientY-r.top)/CELL|0;
  if(grid[row]&&grid[row][c]){grid[row][c]=grid[row][c]==='/'?'\\':'/';draw();}});
build();
</script>
</body></html>
